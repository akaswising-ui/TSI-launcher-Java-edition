name: TSI Dashboard Shell CI (No Minecraft Engine)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK manager was not found under $ANDROID_HOME"
            exit 1
          fi
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          LICENSE_STATUS=${PIPESTATUS[1]}
          set -o pipefail
          if [ "$LICENSE_STATUS" -ne 0 ]; then
            exit "$LICENSE_STATUS"
          fi
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Prepare engine-free Mod Pack screen stub
        shell: bash
        run: |
          cat > app/src/main/java/com/tsi/launcher/ModPackManagerScreen.kt <<'KOTLIN'
          package com.tsi.launcher

          import androidx.compose.foundation.layout.Column
          import androidx.compose.foundation.layout.padding
          import androidx.compose.material3.Text
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.unit.dp

          // This workflow validates only the dashboard shell. The real Modrinth/
          // CurseForge implementation is compiled by android-engine.yml.
          @Composable
          fun ModPackManagerScreen(
              modifier: Modifier = Modifier,
              profileName: String,
              searchQuery: String,
              onInstancesClick: () -> Unit
          ) {
              Column(modifier.padding(12.dp)) {
                  Text("Mod Pack features are available in the full engine APK.")
                  Text(profileName)
                  Text(searchQuery)
              }
          }
          KOTLIN

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TSI-dashboard-shell-smoke-only
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
