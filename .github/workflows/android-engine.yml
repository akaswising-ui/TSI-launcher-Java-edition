name: TSI Android Engine APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out TSI Launcher
        uses: actions/checkout@v4

      - name: Check out pinned Amethyst Android engine
        uses: actions/checkout@v4
        with:
          repository: AngelAuraMC/Amethyst-Android
          ref: 28d6e12d68121b7dd75f2e841058a6b7cdfe4a29
          path: .build/Amethyst-Android
          submodules: false

      - name: Initialize Amethyst native submodules
        working-directory: .build/Amethyst-Android
        shell: bash
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK manager was not found under $ANDROID_HOME"
            exit 1
          fi
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          LICENSE_STATUS=${PIPESTATUS[1]}
          set -o pipefail
          if [ "$LICENSE_STATUS" -ne 0 ]; then
            exit "$LICENSE_STATUS"
          fi
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36.1" \
            "build-tools;36.1.0" \
            "ndk;27.3.13750724"

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"
          validate-wrappers: false

      - name: Integrate TSI Compose launcher with Amethyst engine
        run: bash scripts/integrate-amethyst-engine.sh "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.build/Amethyst-Android"

      - name: Generate Amethyst language list
        working-directory: .build/Amethyst-Android
        run: bash scripts/languagelist_updater.sh

      - name: Build engine-integrated TSI APK
        working-directory: .build/Amethyst-Android
        run: |
          chmod +x gradlew
          ./gradlew :app_pojavlauncher:assembleDebug --no-daemon --stacktrace

      - name: Verify TSI Kotlin UI was compiled into the engine APK
        shell: bash
        run: |
          python3 - <<'PY'
          import struct
          import zipfile

          apk = ".build/Amethyst-Android/app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk"
          dex_strings = set()
          with zipfile.ZipFile(apk) as archive:
              apk_entries = set(archive.namelist())
              required_assets = [
                  "assets/default.json",
                  "assets/components/lwjgl3/3.3.3/lwjgl.jar",
                  "assets/components/lwjgl3/3.3.3/lwjgl-3.3.3-merged-modules.jar",
                  "assets/components/lwjgl3/3.3.3/lwjgl-lwjglx.jar",
                  "assets/components/lwjgl3/3.3.3/lwjgl-openal.jar",
                  "assets/components/lwjgl3/3.4.1/lwjgl.jar",
                  "assets/components/lwjgl3/3.4.1/lwjgl-3.4.1-merged-modules.jar",
                  "assets/components/lwjgl3/3.4.1/lwjgl-lwjglx.jar",
                  "assets/components/lwjgl3/3.4.1/lwjgl-openal.jar",
              ]
              missing_assets = [name for name in required_assets if name not in apk_entries]
              if missing_assets:
                  raise SystemExit("Amethyst LWJGL/control assets missing from APK: " + ", ".join(missing_assets))

              required_native = {"libpojavexec.so", "libpojavexec_awt.so", "libexithook.so"}
              natives_by_abi = {}
              for name in apk_entries:
                  parts = name.split("/")
                  if len(parts) == 3 and parts[0] == "lib":
                      natives_by_abi.setdefault(parts[1], set()).add(parts[2])
              usable_abis = [abi for abi, libs in natives_by_abi.items()
                             if required_native.issubset(libs)]
              if not usable_abis:
                  raise SystemExit("APK has no ABI containing all Amethyst JVM/native host libraries.")

              dex_files = [name for name in archive.namelist()
                           if name.startswith("classes") and name.endswith(".dex")]
              if not dex_files:
                  raise SystemExit("Engine APK contains no DEX files.")
              for dex_name in dex_files:
                  dex = archive.read(dex_name)
                  if len(dex) < 112 or not dex.startswith(b"dex\n"):
                      raise SystemExit(f"Invalid DEX file: {dex_name}")
                  string_count, string_offset = struct.unpack_from("<II", dex, 56)
                  for index in range(string_count):
                      position = struct.unpack_from("<I", dex, string_offset + index * 4)[0]
                      cursor = position
                      while dex[cursor] & 0x80:
                          cursor += 1
                      cursor += 1
                      end = dex.find(b"\0", cursor)
                      if end < 0:
                          raise SystemExit(f"Invalid DEX string table in {dex_name}")
                      dex_strings.add(dex[cursor:end].decode("utf-8", "replace"))

          required = [
              "Lcom/tsi/launcher/MainActivity;",
              "Lcom/tsi/launcher/runtime/AmethystEngineBridge;",
              "Lcom/tsi/launcher/storage/AmethystStoragePaths;",
              "Lcom/tsi/launcher/storage/VersionDirectoryManager;",
              "migrateLegacyStorage",
              "hasLegacyStoragePermission",
              "Lcom/tsi/launcher/runtime/DevicePerformanceProfile;",
              "Lcom/tsi/launcher/data/MinecraftLibraryResolver;",
              "verifyAmethystOfflineAccount",
              "ensureOfflineAccountSelected",
              "refreshListedVersion",
              "ensureRuntimeForInstaller",
              "isRuntimeUsable",
              "No compatible Android Java runtime found for Minecraft Java ",
              "Offline account",
              "Offline username",
              "Add account",
              "File Manager access",
              "OPEN FILE ACCESS SETTINGS",
          ]
          missing = [item for item in required if item not in dex_strings]
          if missing:
              raise SystemExit("TSI Compose code is missing from the APK DEX: " + ", ".join(missing))
          print("Verified TSI MainActivity and Add Offline Account UI in APK DEX.")
          PY

      - name: Stage TSI engine APK
        shell: bash
        run: |
          mkdir -p out
          APK=".build/Amethyst-Android/app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk"
          test -s "$APK"
          cp "$APK" out/TSI-Launcher-engine-debug.apk
          sha256sum out/TSI-Launcher-engine-debug.apk > out/TSI-Launcher-engine-debug.apk.sha256

      - name: Upload engine APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TSI-Launcher-engine-debug
          path: |
            out/TSI-Launcher-engine-debug.apk
            out/TSI-Launcher-engine-debug.apk.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Verify packaged app identity and original Pojav launcher entry
        shell: bash
        run: |
          set -euo pipefail
          APK=out/TSI-Launcher-engine-debug.apk
          AAPT="$ANDROID_HOME/build-tools/36.1.0/aapt"
          test -x "$AAPT"
          BADGING="$("$AAPT" dump badging "$APK")"
          grep -E "^package: name='com\\.tsi\\.launcher(\\.debug)?'" <<< "$BADGING"
          grep -E "^launchable-activity: name='net\\.kdt\\.pojavlaunch\\.TestStorageActivity'([[:space:]]|$)" <<< "$BADGING"
          if grep -F "launchable-activity: name='com.tsi.launcher.MainActivity'" <<< "$BADGING"; then
            echo "TSI dashboard must not replace the original Pojav launcher entry."
            exit 1
          fi

      - name: Publish engine APK as the direct Java Edition download
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: android-debug-latest
        shell: bash
        run: |
          set -euo pipefail
          APK=out/TSI-Launcher-engine-debug.apk
          RELEASE_APK=out/app-debug.apk
          SHA=out/TSI-Launcher-engine-debug.apk.sha256
          cp "$APK" "$RELEASE_APK"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK" "$RELEASE_APK" "$SHA" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" --title "TSI Launcher Java Edition Engine APK" \
              --notes "Engine-integrated Java Edition APK. Includes the Amethyst Android JVM/game host. The original Pojav launcher home remains the app entry screen. Debug build for testing." \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" "$APK" "$RELEASE_APK" "$SHA" \
              --repo "$GITHUB_REPOSITORY" \
              --title "TSI Launcher Java Edition Engine APK" \
              --notes "Engine-integrated Java Edition APK. Includes the Amethyst Android JVM/game host. The original Pojav launcher home remains the app entry screen. Debug build for testing." \
              --prerelease \
              --target "$GITHUB_SHA"
          fi
